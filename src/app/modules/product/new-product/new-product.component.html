<h2 mat-dialog-title> {{formState}} Producto </h2>    
<mat-dialog-content>
    <form [formGroup]="productForm">
        <div class="product-container">
            <!-- name field -->
            <mat-form-field class="bg-c-white">
                <mat-label>Nombre</mat-label>
                <input matInput placeholder="" formControlName="name" required/>
            </mat-form-field>
            
            <!-- category field -->
            <mat-form-field>
                <mat-label>Categoría</mat-label>
                <mat-select formControlName="category" required>
                    <mat-option *ngIf="cargandoCategorias"> Cargando Categorías</mat-option>
                    <mat-option *ngFor="let category of categories " [value] = "category.id"> 
                        {{category.name}} </mat-option > 
                </mat-select>
            </mat-form-field>

            <!-- account field -->
            <mat-form-field>
                <mat-label>Cantidad</mat-label>
                <input matInput placeholder="" formControlName="account" required/>
            </mat-form-field>

            <!-- costPrice field -->
            <mat-form-field>
                <mat-label>Costo</mat-label>
                <input matInput placeholder="" formControlName="costPrice" required/>
            </mat-form-field>

            <!-- sellPrice field -->
            <mat-form-field>
                <mat-label>Precio de Venta</mat-label>
                <input matInput placeholder="" formControlName="sellPrice" required/>
            </mat-form-field>

            <!-- picture field -->
            <mat-form-field>
                <mat-label>Imagen</mat-label>
                <input matInput [value]="selectedFileName" readonly placeholder="Selecciona una imagen"/>
                <button mat-icon-button matSuffix (click)="fileInput.click()">
                    <mat-icon>attach_file</mat-icon>
                </button>

                <!-- picture inpute: hidden -->
                <input
                #fileInput
                type="file"
                accept="image/*"
                style="display: none"
                (change)="onFileSelected($event)"
                required/>

                <!-- Preview -->
                <div *ngIf="imageUrl" class="image-preview">
                    <img [src]="imageUrl" alt="Preview" style="max-width: 200px; margin-top: 10px;"/>
                </div>

                
            </mat-form-field>
        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-button color="primary" (click)="onSave()" [disabled]="productForm.invalid">
        <mat-icon>save</mat-icon> Guardar
    </button>
    <button mat-button color="warn" (click)="onCancel()">
        <mat-icon>cancel</mat-icon> Cancelar
    </button>
</mat-dialog-actions>
